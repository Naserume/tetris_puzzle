<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼즐 — 테트리스 퍼즐</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-puzzle">

<a class="backlink" href="index.html">← 메뉴</a>

<header class="phead">
  <span class="phead__badge" id="puzzle-mode">레슨</span>
  <h1 class="phead__title" id="puzzle-title">불러오는 중</h1>
  <span class="phead__cat" id="puzzle-cat"></span>
  <span class="phead__num" id="puzzle-num"></span>
</header>

<main class="game game--puzzle">
  <aside class="panel panel--left">
    <section class="box box--hold">
      <h2 class="box__title">HOLD</h2>
      <canvas id="hold-canvas" class="preview preview--hold"></canvas>
    </section>

    <section class="box stats">
      <div class="stat">
        <span class="stat__label">진행</span>
        <span class="stat__value" id="progress">—</span>
      </div>
      <div class="stat">
        <span class="stat__label">판</span>
        <span class="stat__value" id="stage">1 / 1</span>
      </div>
      <div class="stat">
        <span class="stat__label">둔 수</span>
        <span class="stat__value" id="moves">0</span>
      </div>
    </section>
  </aside>

  <div class="well" id="well">
    <canvas id="board" class="board"></canvas>
    <div class="bubble" id="bubble" hidden></div>

    <div class="stagecard" id="stagecard" hidden></div>
  </div>

  <aside class="panel panel--right">
    <section class="box box--next">
      <h2 class="box__title">NEXT</h2>
      <canvas id="next-canvas" class="preview preview--next"></canvas>
    </section>
  </aside>
</main>

<section class="brief">
  <p class="brief__text" id="brief"></p>
  <p class="brief__hint" id="hint" hidden></p>
</section>

<nav class="toolbar">
  <button class="btn btn--ghost" id="btn-undo" type="button">되돌리기</button>
  <button class="btn btn--ghost" id="btn-restart" type="button">처음으로</button>
  <button class="btn btn--ghost" id="btn-hint" type="button">힌트</button>
  <button class="btn btn--ghost" id="btn-next" type="button">다음 문제</button>
</nav>

<nav class="touch" aria-label="터치 조작">
  <button class="touch__btn" data-action="left" aria-label="왼쪽">←</button>
  <button class="touch__btn" data-action="rotate" aria-label="회전">↻</button>
  <button class="touch__btn" data-action="right" aria-label="오른쪽">→</button>
  <button class="touch__btn" data-action="down" aria-label="소프트 드롭">↓</button>
  <button class="touch__btn touch__btn--accent" data-action="drop" aria-label="놓기">⤓</button>
  <button class="touch__btn" data-action="hold" aria-label="홀드">H</button>
</nav>

<footer class="help">
  <dl class="help__list" id="help-list"></dl>
</footer>

<div class="modal" id="result" hidden>
  <div class="modal__sheet modal__sheet--result" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <header class="modal__head">
      <h2 class="modal__title" id="result-title"></h2>
      <span class="result__score" id="result-score" hidden></span>
    </header>

    <div class="modal__body">
      <p class="result__text" id="result-text"></p>
      <ol class="breakdown" id="result-breakdown" hidden></ol>
      <p class="result__outro" id="result-outro" hidden></p>
    </div>

    <footer class="modal__foot">
      <div class="modal__actions">
        <button class="btn btn--ghost" id="result-retry" type="button">다시 풀기</button>
        <button class="btn" id="result-next" type="button">다음 문제</button>
      </div>
    </footer>
  </div>
</div>

<button class="settings-open" id="settings-open" type="button" aria-label="설정 열기">
  <span aria-hidden="true">⚙</span>
</button>

<div class="modal" id="settings" hidden>
  <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="modal__head">
      <h2 class="modal__title" id="settings-title">설정</h2>
      <button class="modal__close" id="settings-close" type="button" aria-label="닫기">✕</button>
    </header>

    <div class="modal__body">
      <section class="modal__section">
        <h3 class="modal__subtitle">조작키</h3>
        <p class="modal__lead">키를 클릭한 뒤 원하는 키를 누르세요. 동작 하나에 최대 3개까지 지정할 수 있습니다.</p>
        <div class="keymap" id="keymap"></div>
      </section>

      <section class="modal__section">
        <h3 class="modal__subtitle">반응 속도</h3>
        <div class="sliders" id="sliders"></div>
      </section>
    </div>

    <footer class="modal__foot">
      <p class="modal__note" id="settings-note" hidden></p>
      <div class="modal__actions">
        <button class="btn btn--ghost" id="settings-reset" type="button">기본값으로</button>
        <button class="btn" id="settings-done" type="button">완료</button>
      </div>
    </footer>
  </div>
</div>

<script type="module" src="js/puzzle-main.js"></script>
</body>
</html>
